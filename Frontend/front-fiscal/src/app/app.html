<div class="flex h-screen overflow-hidden bg-slate-50 font-sans">
  <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-20 transition-all duration-300">
    <div class="p-8 flex items-center space-x-3 bg-slate-950/40">
      <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <lucide-icon [img]="DashboardIcon" class="text-white w-6 h-6"></lucide-icon>
      </div>
      <div>
        <h1 class="text-xl font-bold text-white tracking-tight">Korp ERP</h1>
        <p class="text-[10px] uppercase tracking-[0.2em] text-indigo-400 font-semibold">Enterprise Solution</p>
      </div>
    </div>

    <nav class="flex-1 px-4 py-8 space-y-2 overflow-y-auto">
      <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Gerenciamento</p>
      
      <a routerLink="/notas" routerLinkActive="bg-slate-800 text-white shadow-sm shadow-black/20" 
         class="flex items-center justify-between px-4 py-3.5 rounded-xl transition-all duration-200 group hover:bg-slate-800 hover:text-white">
        <div class="flex items-center space-x-3">
          <lucide-icon [img]="NotaIcon" class="w-5 h-5 text-slate-400 group-hover:text-indigo-400"></lucide-icon>
          <span class="font-medium">Notas Fiscais</span>
        </div>
        <lucide-icon [img]="ArrowIcon" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity"></lucide-icon>
      </a>

      <a routerLink="/produtos" routerLinkActive="bg-slate-800 text-white shadow-sm shadow-black/20" 
         class="flex items-center justify-between px-4 py-3.5 rounded-xl transition-all duration-200 group hover:bg-slate-800 hover:text-white">
        <div class="flex items-center space-x-3">
          <lucide-icon [img]="ProdutoIcon" class="w-5 h-5 text-slate-400 group-hover:text-indigo-400"></lucide-icon>
          <span class="font-medium">Gestão de Estoque</span>
        </div>
        <lucide-icon [img]="ArrowIcon" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity"></lucide-icon>
      </a>

      <div class="pt-8 px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Preferências</div>
      
      <a href="#" class="flex items-center space-x-3 px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-slate-800 hover:text-white group">
        <lucide-icon [img]="SettingsIcon" class="w-5 h-5 text-slate-400 group-hover:text-slate-200"></lucide-icon>
        <span class="font-medium">Configurações</span>
      </a>
    </nav>

    <div class="p-6 border-t border-slate-800/50 bg-slate-950/20">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center text-white font-bold ring-2 ring-slate-800">
          JV
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-white truncate">João Vitor</p>
          <p class="text-xs text-slate-500 truncate">Administrador</p>
        </div>
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
    
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-10 z-10 shrink-0">
      <div class="flex items-center space-x-2 text-sm text-slate-500 font-medium">
        <span>Sistema</span>
        <span class="text-slate-300">/</span>
        <span class="text-slate-900 font-semibold">{{ title() }}</span>
      </div>
      <div class="flex items-center space-x-4">
        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-tighter">Backend Online</span>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-10 bg-slate-50">
      <div class="max-w-7xl mx-auto space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
